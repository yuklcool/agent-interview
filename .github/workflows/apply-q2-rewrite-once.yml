name: Apply Q2 evaluation rewrite once

on:
  push:
    paths:
      - '.github/workflows/apply-q2-rewrite-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Q2 from staged replacement text
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          main = Path('docs/supplement-2026-runtime-reliability-eval-memory-04.md')
          staged = Path('.github/workflows/rewrite-q2-eval-once.yml')
          src = staged.read_text(encoding='utf-8')
          marker = "replacement = r'''"
          s = src.index(marker) + len(marker)
          e = src.index("'''\n\n          path.write_text", s)
          replacement = src[s:e]
          text = main.read_text(encoding='utf-8')
          q2 = '# Q2. 如何搭建 Agent 自动化评测体系？如何量化任务成功率、幻觉率、用户解决率？'
          q3 = '# Q3. 模型迭代、Prompt 迭代后，如何做基线对比和灰度验证？'
          a = text.index(q2)
          b = text.index(q3, a)
          main.write_text(text[:a] + replacement + text[b:], encoding='utf-8')
          staged.unlink()
          Path('.github/workflows/apply-q2-rewrite-once.yml').unlink()
          PY
      - name: Commit rewrite and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: deepen Q2 agent evaluation system"
          git push
