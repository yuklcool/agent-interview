name: Patch interview doc once

on:
  push:
    paths:
      - '.tmp/expand_nanobot_repeat_guard.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .tmp/expand_nanobot_repeat_guard.py

      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supplement-2026-runtime-reliability-eval-memory-04.md
          git rm .tmp/expand_nanobot_repeat_guard.py .github/workflows/patch-interview-doc-once.yml
          git commit -m "docs: add nanobot repeated lookup implementation follow-up"
          git push
