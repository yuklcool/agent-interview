          replacement = r'''# 12. nanobot 当前代码怎么对应这套设计

当前 nanobot 对“重复外部查询”的实现非常值得拿来做面试追问，因为它体现了一个很典型的 Harness 思路：**不要只靠 Prompt 告诉模型“不要重复调用”，而是在 Tool 真正执行之前，用确定性的 Runtime Guard 做拦截。**

当前相关代码主要分布在：

```text
nanobot/agent/runner.py
nanobot/agent/tools/execution.py
nanobot/utils/runtime.py
```

核心调用发生在 `execution.py`：

```python
lookup_error = repeated_external_lookup_error(
    tool_call.name,
    tool_call.arguments,
    external_lookup_counts,
)

if lookup_error:
    event = {
        "name": tool_call.name,
        "status": "error",
        "detail": "repeated external lookup blocked",
    }
    return _with_retry_hint(lookup_error), event
```

最重要的是调用顺序：

```text
LLM 产生 Tool Call
        ↓
repeated_external_lookup_error(...)
        ↓
重复次数超限？
   ├─ Yes → 直接返回 Tool Error Observation
   │          ↓
   │      不执行真实 Tool
   │
   └─ No  → prepare_call
              ↓
          before_execute_tool hook
              ↓
          tool.execute(...)
```

也就是说，Guard 位于真正的 `tool.execute()` **之前**。因此第三次重复搜索被拦截时，不会再产生一次真实 HTTP 请求，也不会继续消耗外部搜索 API 的 QPS/配额。

## 12.1 `external_lookup_counts` 是什么？生命周期在哪里？

`AgentRunner._run_core()` 开始执行时会创建：

```python
external_lookup_counts: dict[str, int] = {}
```

随后每一次 iteration 执行 Tool 时，都会把**同一个 dict**传给 `execute_tool_calls()`：

```text
AgentRunner._run_core()
        │
        ├─ external_lookup_counts = {}
        │
        ├─ Iteration 0
        │     └─ execute_tool_calls(..., external_lookup_counts)
        │
        ├─ Iteration 1
        │     └─ execute_tool_calls(..., external_lookup_counts)
        │
        └─ Iteration 2
              └─ execute_tool_calls(..., external_lookup_counts)
```

所以它能够跨同一次 Agent Run 的多个 LLM iteration 统计重复查询。

但它不是：

```text
Redis 状态
数据库状态
Session 长期状态
跨进程共享状态
```

新的 `_run_core()` 开始后会重新创建空字典。因此它本质上是：

> **当前 Run/Turn 内的短生命周期 Loop Guard State。**

这也意味着它解决的是“当前 Agent Loop 正在原地重复搜索”，而不是跨会话的重复查询治理。

## 12.2 nanobot 如何判断“这是同一个查询”？

真正生成查询标识的是 `nanobot/utils/runtime.py` 中的 `external_lookup_signature()`。

当前只针对两个 Tool：

```text
web_search
web_fetch
```

逻辑可以简化成：

```python
def external_lookup_signature(tool_name, arguments):
    if not isinstance(arguments, dict):
        return None

    if tool_name == "web_fetch":
        url = str(arguments.get("url") or "").strip()
        if url:
            return f"web_fetch:{url.lower()}"

    if tool_name == "web_search":
        query = str(
            arguments.get("query")
            or arguments.get("search_term")
            or ""
        ).strip()
        if query:
            return f"web_search:{query.lower()}"

    return None
```

例如：

```text
web_search(query="Nanobot Agent")
```

得到：

```text
web_search:nanobot agent
```

下一轮：

```text
web_search(query="nanobot agent")
```

仍然得到：

```text
web_search:nanobot agent
```

因此它们会命中同一个计数项。

这里要特别注意：nanobot 当前没有做 SHA256，也没有一个很重的 `ActionFingerprint` 对象。**这个 signature 字符串本身就是去重 Key。**

所以前面讲的通用：

```text
ActionKey = tool_name + canonical_args + scope + state_version
```

在 nanobot 当前实现里，实际上是一个更轻量、更特化的版本：

```text
web_search → tool_name + lower(query)
web_fetch  → tool_name + lower(url)
```

## 12.3 为什么第三次开始拦截？

`runtime.py` 当前常量是：

```python
_MAX_REPEAT_EXTERNAL_LOOKUPS = 2
```

计数逻辑：

```python
count = seen_counts.get(signature, 0) + 1
seen_counts[signature] = count

if count <= _MAX_REPEAT_EXTERNAL_LOOKUPS:
    return None
```

因此：

```text
第一次相同查询
count = 1
→ Allow

第二次相同查询
count = 2
→ Allow

第三次相同查询
count = 3
→ Block

第四次及以后
→ Block
```

为什么不是第一次重复就直接禁止？这是一个很实用的折中：真实外部查询可能因为瞬时错误、搜索结果波动等原因需要有限重试，所以 Runtime 给了一个很小的 retry budget，而不是“一次查询后永久禁止”。

可以把它理解为：

```text
Exact Lookup Retry Budget = 2 attempts
```

而不是一个严格的“一次性去重锁”。

## 12.4 被拦截后为什么 Agent 还能继续？

超限时 `repeated_external_lookup_error()` 返回的不是 Python Exception，而是一段 Tool Error 文本：

```text
Error: repeated external lookup blocked.
Use the results you already have to answer,
or try a meaningfully different source.
```

`execution.py` 又通过 `_with_retry_hint()` 追加：

```text
[Analyze the error above and try a different approach.]
```

最终这段内容会作为 **Tool Observation** 回到模型上下文。

运行效果是：

```text
LLM
 ↓
第 3 次提出相同 web_search
 ↓
Runtime Guard 拦截
 ↓
不访问真实 Search Provider
 ↓
生成 Tool Error Observation
 ↓
送回下一轮 LLM
 ↓
模型重新决策
 ├─ 使用已有结果回答
 ├─ 换真正不同的 Query
 ├─ 换信息源
 └─ 停止继续搜索
```

这体现了一个很重要的 Agent Runtime 原则：

> **Runtime 可以拒绝模型提出的 Action，但不一定要终止整个 Agent Run；更好的做法通常是把结构化失败作为 Observation 返回，让模型在硬边界内重新规划。**

## 12.5 它统计的是“调用尝试”，不是“成功查询”

这里有个很容易忽略的源码细节：计数发生在 `tool.execute()` **之前**。

所以：

```text
第 1 次 web_search
→ Provider 网络失败

第 2 次相同 web_search
→ Provider 网络失败

第 3 次相同 web_search
→ Runtime 直接 BLOCK
```

仍然会触发重复查询保护。

因此 `external_lookup_counts` 记录的准确含义是：

> **相同 External Lookup Signature 在当前 Run 中被尝试了多少次。**

不是：

> 成功返回了多少次。

这也是为什么它更像“Loop Retry Budget”，而不是 Cache 或成功结果计数器。

## 12.6 并发 Tool Call 时会不会计数乱掉？

nanobot 支持把 `concurrency_safe` 的 Tool 用 `asyncio.gather()` 并发执行，但 `_execute_tool_call()` 一进入函数，首先执行的就是同步的：

```python
repeated_external_lookup_error(...)
```

在这个 Guard 调用之前没有 `await`。

因此在单个 asyncio event loop 中，同一批协程会先后完成这段同步计数逻辑，然后才进入后续 `await`。它们共享同一个 `external_lookup_counts`，所以同一个 batch 中出现完全相同的 external lookup，也会消耗同一个 repeat budget。

不过这仍然只是**进程内、当前 Run 内状态**。如果未来把一个逻辑 Run 真正拆到多个进程/节点并行，就不能继续依赖普通 Python dict，需要把 dedup/budget 状态提升到共享的 Runtime State/Redis/数据库或统一调度器中。

## 12.7 当前实现能识别什么，不能识别什么？

它能识别这种：

```text
web_search("Nanobot Agent")
web_search("nanobot agent")
```

因为做了：

```python
.strip().lower()
```

但是识别不了：

```text
web_search("上海酒店")
web_search("上海的酒店")
web_search("上海住宿")
```

因为三个字符串不同。

也识别不了普通业务 Tool：

```text
query_device(project_id="P1")
query_device(project_id="P1")
query_device(project_id="P1")
```

因为 `external_lookup_signature()` 对 `query_device` 会直接返回 `None`。

所以 nanobot 当前解决的是：

```text
Exact / Near-exact repeated external lookup
```

没有解决：

```text
Generic Tool Dedup
Semantic No-progress
State-aware Dedup
Cross-run Dedup
Business Idempotency
```

## 12.8 `web_fetch` 还有一个值得追问的实现细节

当前 `web_fetch` 直接使用：

```python
url.lower()
```

作为 signature 的一部分。

这是一个很轻量的防循环实现，但不是严格 URL Canonicalization。URL 的 hostname 大小写通常不敏感，但 path 理论上可能区分大小写：

```text
https://example.com/API/User
https://example.com/api/user
```

当前 Guard 会把它们当成同一个 signature。

如果做更严格的企业实现，应该解析 URL：

```text
scheme  → normalize
host    → lowercase
port    → normalize default port
path    → 按 URL 语义保留
query   → canonical sort / normalize
fragment→ 视场景忽略
```

这也说明 nanobot 当前设计的目标不是构建一个通用 Dedup Engine，而是用很低复杂度解决“模型连续重复 Web 查询”这个高频问题。

## 12.9 测试是怎么证明这个 Guard 真生效的？

当前测试 `tests/agent/test_runner_tool_execution.py` 对这个行为有明确断言：模型连续产生重复 external lookup 后，第三次 Tool Message 中包含：

```text
repeated external lookup blocked
```

同时实际 Tool 的：

```text
execute.await_count == 2
```

这两个断言一起非常重要：

```text
有 Error 文本
```

只能证明模型看到了提示；而：

```text
真实 Tool 只 execute 了 2 次
```

才证明第三次请求确实在 Runtime 层被阻断，没有继续打到下游。

## 12.10 这段源码真正体现的设计思想

不要只把它记成：

```text
nanobot 有一个 repeated_external_lookup_error 函数
```

真正值得面试里讲的是四层思想：

```text
概率性模型提出 Action
        ↓
确定性 Runtime Guard 校验
        ↓
不允许的 Action 不执行
        ↓
把拒绝结果变成 Observation
        ↓
模型在约束范围内重新规划
```

也就是：

> **LLM 负责提出动作，Runtime 决定动作能不能执行。**

这和权限校验、Workspace Boundary、SSRF Guard、Budget、HITL 的思想其实是一致的。

## 12.11 面试口述版

> nanobot 当前没有做一个很重的通用 Action Fingerprint 系统，而是针对 `web_search` 和 `web_fetch` 做了 per-run repeated external lookup guard。`AgentRunner._run_core()` 会创建一个 `external_lookup_counts` 字典，并在整个 Tool Loop 的多个 iteration 中复用。`web_search` 用 lower-case query、`web_fetch` 用 lower-case URL 生成 signature；同一个 signature 第一次和第二次允许执行，第三次开始在真正 `tool.execute()` 之前直接拦截。拦截不是让整个 Agent 抛异常，而是返回一个 `repeated external lookup blocked` 的 Tool Observation，再让模型使用已有结果或者换真正不同的搜索策略。这个实现统计的是 attempt，不是 success，而且只解决 exact repeated web lookup，不解决普通业务 Tool、语义 No-progress、跨 Run 去重和业务幂等。如果做企业级扩展，我会继续加入 canonical args、scope、state version 和 progress/evidence 变化判断。

## 12.12 面试官继续追问：它和 Action Fingerprint 是什么关系？

可以这样回答：

```text
通用 Action Fingerprint 思路：
    tool_name
  + canonical_args
  + execution_scope
  + relevant_state_version

nanobot 当前实现：
web_search
  → "web_search:" + lower(query)

web_fetch
  → "web_fetch:" + lower(url)
```

所以 nanobot 当前的 `external_lookup_signature` 可以理解成 **Action Fingerprint 思想的一个极简、专用实现**，但不能反过来说“nanobot 已经实现了完整 Action Fingerprint 引擎”。

企业级完整治理仍然需要：

```text
canonical args
state-aware dedup
semantic no-progress
per-tool budget
tenant/user quota
provider circuit breaker
side-effect idempotency/reconcile
```

这个边界在面试里必须说准确。

