name: Merge Q6 deep dive into main supplement once

on:
  push:
    paths:
      - '.github/workflows/merge-q6-into-main-doc-once.yml'

permissions:
  contents: write

jobs:
  merge-q6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge deep Q6 into supplement
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main_path = Path('docs/supplement-2026-runtime-reliability-eval-memory-04.md')
          deep_path = Path('03-tools-mcp/tool-call-governance-deep-dive.md')

          text = main_path.read_text(encoding='utf-8')
          deep = deep_path.read_text(encoding='utf-8').strip()

          q6 = '# Q6. 大量无效 Tool 调用会拉高成本、拖慢 QPS，做过哪些限流与拦截机制？'
          q7 = '# Q7. Redis 在 Agent 系统中到底存什么？'

          start = text.index(q6)
          end = text.index(q7, start)

          deep = deep.replace(
              '# 大量无效 Tool 调用怎么治理：从 Tool 暴露、重复检测、Budget 到下游保护',
              q6,
              1,
          )

          merged = text[:start] + deep + '\n\n---\n\n' + text[end:]
          main_path.write_text(merged, encoding='utf-8')
          deep_path.unlink()
          PY

      - name: Commit merged document
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supplement-2026-runtime-reliability-eval-memory-04.md 03-tools-mcp/tool-call-governance-deep-dive.md
          git commit -m "docs: merge Q6 tool governance into main supplement"
          git push
